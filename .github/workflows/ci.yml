name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marketreader
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: marketreader
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketreader -d marketreader"
          --health-interval 5s --health-timeout 5s --health-retries 8
    env:
      DATABASE_URL: postgres://marketreader:testpassword@localhost:5432/marketreader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - name: Credential and dependency license gates
        run: npm run security:check && npm run license:audit
      - name: Audit checked-in source lines
        run: CODE_AUDIT_OUTPUT=code-audit.json npm run code:audit
      - uses: actions/upload-artifact@v4
        with:
          name: source-line-audit
          path: code-audit.json
          retention-days: 30
      - run: sh -n scripts/start-unix.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests_py -v
      - run: npm run db:migrate
      - name: Check PostgreSQL schema
        run: node scripts/verify-db.js
      - name: PostgreSQL ingestion and source-health integration tests
        run: node --test tests_db/*.test.js
      - name: Docker build
        run: docker build -t marketreaderpro:ci .
      - name: Boot container and smoke test
        run: |
          docker run -d --name mrp-smoke -p 127.0.0.1:31987:3000 -e ENABLE_EXPERIMENTAL_FEATURES=false marketreaderpro:ci
          for i in $(seq 1 12); do if curl --fail --silent http://127.0.0.1:31987/api/health >/dev/null; then break; fi; sleep 1; done
          SMOKE_URL=http://127.0.0.1:31987 npm run smoke
          docker rm -f mrp-smoke
