name: Downloadable Packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify && npm run package:check
      - name: Generate third-party license report
        run: npm run license:report
      - name: Build downloadable ZIP archive
        run: |
          mkdir -p dist/MarketreaderPro
          cp -R apps agent db scripts docs dist/MarketreaderPro/
          cp package.json package-lock.json Dockerfile compose.yaml .env.example README.md SECURITY.md NOTICE dist/MarketreaderPro/
          cp dist/THIRD_PARTY_LICENSES.txt dist/MarketreaderPro/
          cd dist
          zip -qr MarketreaderPro-application.zip MarketreaderPro
      - uses: actions/upload-artifact@v4
        with:
          name: MarketreaderPro-application
          path: dist/MarketreaderPro-application.zip
          retention-days: 30
          if-no-files-found: error
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/samadalam481470sa-cmd/marketreaderpro:latest
