services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: marketreader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or .env}
      POSTGRES_DB: marketreader
    volumes:
      - marketreader_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketreader -d marketreader"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [internal]
  web:
    build: .
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: postgres://marketreader:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/marketreader
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]
  migrate:
    build: .
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://marketreader:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/marketreader
    command: ["node","scripts/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
  ingest:
    build: .
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://marketreader:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/marketreader
    command: ["node","scripts/ingest.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
networks:
  internal:
volumes:
  marketreader_pg:
